<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Pingo settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #fdfdf7;
        color: #1c1c1c;
        padding: 20px 24px;
        font-size: 13px;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 14px;
      }
      .field {
        margin-bottom: 14px;
      }
      .title {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .hint {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
      }
      input[type='text'],
      input[type='number'],
      select {
        font: inherit;
        font-size: 14px;
        padding: 8px 10px;
        border: 2px solid #1c1c1c;
        border-radius: 6px;
        background: #fff;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      input[type='text'] {
        width: 100%;
      }
      input[type='number'] {
        width: 80px;
      }
      input:focus,
      select:focus {
        border-color: #37c24a;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .chip {
        font: inherit;
        padding: 5px 11px;
        border: 2px solid #1c1c1c;
        border-radius: 20px;
        background: #fff;
        cursor: pointer;
      }
      .chip.active {
        background: #37c24a;
        color: #fff;
        border-color: #37c24a;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      select:disabled {
        opacity: 0.45;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        align-items: center;
      }
      .spacer {
        flex: 1;
      }
      button.nav {
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        border: 2px solid #1c1c1c;
        border-radius: 6px;
        cursor: pointer;
        background: #fff;
      }
      button.nav:hover {
        background: #eee;
      }
      button.nav.primary {
        background: #37c24a;
        color: #fff;
        border-color: #37c24a;
      }
      button.nav.primary:hover {
        background: #2fae41;
      }
      .status {
        color: #2f9e3f;
        font-weight: 600;
        min-height: 16px;
      }
      .status.error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <h1>Settings</h1>

    <form id="form" novalidate>
      <div class="field">
        <label class="title" for="name">Your name</label>
        <input id="name" type="text" maxlength="24" placeholder="e.g. Alex" autocomplete="off" />
        <p class="hint">Pingo greets you by name. Leave blank to keep it generic.</p>
      </div>

      <div class="field">
        <label class="title" for="message">Remind me to…</label>
        <input
          id="message"
          type="text"
          maxlength="120"
          placeholder="Drink water (default)"
          autocomplete="off"
        />
        <p class="hint">Anything you like: “Stretch and rest your eyes”, “Take your medicine”.</p>
      </div>

      <div class="field">
        <label class="title" for="interval">Every</label>
        <div class="chips" id="chips">
          <button type="button" class="chip" data-min="15">15 min</button>
          <button type="button" class="chip" data-min="30">30 min</button>
          <button type="button" class="chip" data-min="45">45 min</button>
          <button type="button" class="chip" data-min="60">1 hour</button>
          <button type="button" class="chip" data-min="90">90 min</button>
        </div>
        <div class="inline">
          <input id="interval" type="number" min="1" max="720" />
          <span>minutes</span>
        </div>
      </div>

      <div class="field">
        <span class="title">Active hours</span>
        <div class="inline">
          <span>From</span>
          <select id="start" aria-label="Start time"></select>
          <span>to</span>
          <select id="end" aria-label="End time"></select>
        </div>
        <label class="check"><input id="allDay" type="checkbox" /> Any time of day</label>
        <p class="hint">Uses your computer's time zone.</p>
      </div>

      <div class="field">
        <label class="title" for="snooze">Snooze for</label>
        <div class="inline">
          <input id="snooze" type="number" min="1" max="120" />
          <span>minutes</span>
        </div>
      </div>

      <div class="row">
        <button type="button" id="character" class="nav">Change character…</button>
        <span class="spacer"></span>
        <button type="button" id="cancel" class="nav">Close</button>
        <button type="submit" class="nav primary">Save</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>

    <script src="settings.js"></script>
  </body>
</html>
