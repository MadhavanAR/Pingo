<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self';"
    />
    <title>Welcome to Pingo</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        background: var(--ground);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        padding: 20px 28px 24px;
      }
      .progress {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .progress span {
        height: 4px;
        border-radius: 999px;
        background: var(--surface-2);
        transition: background-color 300ms var(--ease-out);
      }
      .progress span.on {
        background: var(--text);
      }
      .stage {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 20px;
        padding-top: 20px;
        min-height: 0;
      }
      .hero {
        position: relative;
        height: 176px;
        border-radius: var(--radius-card);
        background: var(--surface);
        overflow: hidden;
      }
      .hero img {
        position: absolute;
        bottom: 0;
        left: 50%;
        height: 160px;
        translate: -50% 0;
        object-fit: contain;
        transition:
          opacity 200ms var(--ease-out),
          transform 400ms var(--ease-out);
      }
      .hero img.swap {
        opacity: 0;
        transform: translateY(10px);
      }
      .step {
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .step.enter {
        animation: step-in 320ms var(--ease-out) both;
      }
      @keyframes step-in {
        from {
          opacity: 0;
          transform: translateX(12px);
        }
      }
      h1 {
        font-family: var(--font-greeting);
        font-weight: 400;
        font-size: 34px;
        line-height: 38px;
        letter-spacing: -0.02em;
      }
      .lede {
        color: var(--muted);
        margin-top: -8px;
      }
      .times {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .picks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 8px;
        max-height: 200px;
        overflow: auto;
      }
      .pick {
        display: grid;
        gap: 6px;
        padding: 6px 6px 8px;
        border-radius: 16px;
        border: 1px solid transparent;
        background: var(--surface);
        color: var(--text);
        font: 500 12px/16px var(--font);
        cursor: pointer;
        transition:
          border-color 160ms var(--ease-out),
          transform 160ms var(--ease-out);
      }
      .pick:active {
        transform: scale(0.97);
      }
      .pick[aria-checked='true'] {
        border-color: var(--text);
      }
      .pick .portrait {
        height: 84px;
        background: var(--ground);
      }
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 16px;
      }
      footer .spacer {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="3" id="progress">
      <span></span><span></span><span></span>
    </div>

    <div class="stage">
      <div class="hero"><img id="hero" alt="" /></div>
      <div id="step" class="step"></div>
    </div>

    <footer>
      <button type="button" class="btn quiet" id="skip">Skip setup</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="back">Back</button>
      <button type="button" class="btn primary" id="next">Next</button>
    </footer>

    <script src="common.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
