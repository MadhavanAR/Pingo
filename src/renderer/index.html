<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self';"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage" class="modern">
      <div id="confetti"></div>

      <div
        id="bubble"
        class="hidden"
        role="dialog"
        aria-live="polite"
        aria-labelledby="bubble-text"
      >
        <p id="bubble-text"></p>
        <div id="buttons">
          <button id="yes-btn" class="btn btn-yes">Done</button>
          <button id="snooze-btn" class="btn btn-snooze">Snooze</button>
        </div>
        <div id="bubble-tail"></div>
      </div>

      <div id="pet" class="offstage">
        <img id="sprite-idle" src="../../assets/characters/boy/idle.png" alt="" draggable="false" />
        <img
          id="sprite-drinking"
          class="hidden"
          src="../../assets/characters/boy/drink.png"
          alt=""
          draggable="false"
        />
        <img id="sprite-pose" class="hidden" alt="" draggable="false" />
      </div>
    </div>

    <script src="common.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
